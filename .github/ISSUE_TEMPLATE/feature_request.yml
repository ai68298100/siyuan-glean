name: 功能建议
description: 提议一个能改善剪藏整理、阅读或回顾的具体改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        小驴拾遗优先维护文章属性数据主权、阅读主链和可恢复操作。请说明建议解决的真实工作流问题。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在什么场景让你无法完成任务，或需要反复绕路？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你希望看到的入口、状态、反馈和失败恢复方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 目前如何完成这件事？成本或限制是什么？
  - type: dropdown
    id: surface
    attributes:
      label: 主要界面
      options:
        - Dock / 浮窗
        - 工作台 / 看板
        - 阅读页签
        - 设置页
        - 导入、导出或外部桥接
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 issue，确认没有重复建议。
          required: true
        - label: 这个建议不要求插件内置第三方 API key 或自动上传全部文章。
          required: true
